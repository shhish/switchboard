[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "switchboard"
version = "0.1.0"
description = "Loopback capability core for local agents"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.14.5,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "jsonschema>=4.23"]

[project.scripts]
sb = "switchboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
