# Pull-request gate: the same checks AGENTS.md asks for before a merge.
# Runs on the owner-scoped host runner `mac-mini-ci` (homelab-ops runs it).
name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: mac-mini-ci
    timeout-minutes: 25
    steps:
      - uses: https://gitea.com/actions/checkout@v4

      # The PR title becomes the merge commit, listed in the public GitHub commit.
      - name: PR title convention
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: '"$HOME/.local/bin/oss-publish" lint-title "$PR_TITLE"'

      - name: Install
        run: |
          /opt/homebrew/bin/python3 -m venv .venv
          .venv/bin/pip install -q -e '.[dev]'

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Capability catalog is current
        run: |
          .venv/bin/sb manifest --markdown > /tmp/switchboard-capabilities-$$.md
          diff -q docs/CAPABILITIES.md /tmp/switchboard-capabilities-$$.md
          rm -f /tmp/switchboard-capabilities-$$.md

      - name: Tests
        # A self-hosted runner may export SIM_LEASE (a capacity queue command) so
        # parallel suites wait for room instead of failing timing tests under load.
        run: |
          ${SIM_LEASE:+"$SIM_LEASE" run --class ci --owner switchboard-ci --} .venv/bin/pytest -q
